<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1739"/>
      <stop offset="100%" stop-color="#03050e"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="500" height="500" x="6" y="6" rx="94" fill="none" stroke="#22d3ee" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Outer Cosmic Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="16 12" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#f97316" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Spaceship Hull -->
  <g filter="url(#glow)">
    <!-- Thruster Flame -->
    <polygon points="256,410 236,360 276,360" fill="#f97316" opacity="0.9"/>
    <polygon points="256,430 244,370 268,370" fill="#fbbf24" opacity="0.9"/>
    
    <!-- Wings & Main Body -->
    <polygon points="256,90 350,340 310,360 256,325 202,360 162,340" fill="#0f172a" stroke="#22d3ee" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Wing Accents -->
    <polygon points="256,130 320,330 286,335 256,290 226,335 192,330" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    
    <!-- Cockpit Glass Canopy -->
    <ellipse cx="256" cy="230" rx="22" ry="46" fill="#22d3ee" opacity="0.85"/>
    <ellipse cx="256" cy="225" rx="12" ry="28" fill="#ffffff" opacity="0.75"/>
    
    <!-- Wingtip Cannons -->
    <rect x="156" y="270" width="8" height="50" rx="4" fill="#f43f5e"/>
    <rect x="348" y="270" width="8" height="50" rx="4" fill="#f43f5e"/>
  </g>
</svg>
